# TXT-02 / TXT-04
sintesis:
  titulo: "Síntesis ejecutiva"
  bajada: "Dónde se concentra la actividad gastronómica de la Ciudad y qué zonas se consolidan."
  parrafos:
    - "La actividad gastronómica de la Ciudad se concentra en un conjunto de polos y ejes reconocibles. El arco norte —de Palermo a Belgrano— reúne las mayores concentraciones, con perfiles propios en cada zona."
    - "Los ejes históricos del centro y del sur mantienen plena vigencia: la Avenida Corrientes funciona como un corredor gastronómico y cultural continuo, y San Telmo consolida un núcleo compacto en torno a su mercado y su casco histórico."
    - "Puerto Madero se consolida como un frente gastronómico sobre ambos márgenes de los diques, integrando el paseo costero al circuito de la zona."
    - "Otras zonas de la Ciudad —entre ellas Belgrano y el frente ribereño de la Costanera Norte— muestran señales de actividad que la Dirección mantiene en seguimiento y profundización."
  encuadre: "Este informe ordena 22 zonas de referencia y presenta cinco zonas seleccionadas para una lectura territorial en detalle."
  como_leer_titulo: "Cómo leer esta pieza"
  como_leer: "Cada zona se describe por su forma en el territorio —núcleo, corredor, frente o identidad en tramos— y, por separado, por el grado de consolidación de su lectura: consolidada, con seguimiento, en consolidación o exploratoria. Una cosa es la forma de una zona; otra, cuánto sabemos hoy sobre ella. El distintivo junto al título de cada página indica ese grado de consolidación."
  alcance_pie: "Referencias de lectura territorial elaboradas por la DGDGAS. Alcance completo en la nota metodológica final."

