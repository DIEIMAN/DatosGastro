# TXT-06
palermo:
  titulo: "Palermo y los principales núcleos"
  bajada: "La mayor concentración gastronómica de la Ciudad."
  asset: "mapa_fase25_palermo_las_canitas.png"
  lectura_titulo: "Lectura territorial"
  lectura: "Palermo reúne la mayor concentración gastronómica de la Ciudad. Dentro de la zona conviven sectores con identidad propia —Palermo Soho, Palermo Hollywood y Las Cañitas—, conectados por avenidas que funcionan como articuladores del circuito. La zona combina propuestas consolidadas con renovación permanente de la oferta, y su lectura en detalle continúa profundizándose."
  estado_lectura: "lectura consolidada"

# TXT-07 / TXT-08
corrientes:
  titulo: "Corrientes"
  bajada: "Un corredor gastronómico y cultural continuo, con el Abasto como área asociada."
  asset: "mapa_fase25_corrientes_abasto.png"
  lectura_titulo: "Lectura territorial"
  lectura: "La Avenida Corrientes funciona como un corredor gastronómico continuo, asociado a la actividad teatral y cultural del centro. La intensidad varía a lo largo del recorrido —con tramos de mayor concentración cerca de los teatros y del Obelisco—, pero el corredor se lee como una única estructura, sin cortes."
  abasto_titulo: "Abasto — área asociada"
  abasto: "El entorno del Abasto se presenta como área asociada al polo Corrientes: un sector con identidad propia, vinculado al corredor pero fuera de su traza. Su lectura se mantiene diferenciada de la del eje."
  estado_lectura: "lectura consolidada"

# TXT-09 / TXT-10
san_telmo_puerto_madero:
  titulo: "San Telmo y Puerto Madero"
  bajada: "Un núcleo histórico compacto y un frente gastronómico sobre los diques."
  asset_san_telmo: "mapa_fase25_san_telmo.png"
  asset_puerto: "mapa_fase25_puerto_madero.png"
  san_telmo_titulo: "San Telmo — núcleo gastronómico"
  san_telmo: "San Telmo consolida un núcleo gastronómico compacto en torno al mercado y al casco histórico. La calle Defensa acompaña esa lectura como eje de contexto, articulando el recorrido peatonal entre la Plaza de Mayo y el sur del barrio."
  puerto_titulo: "Puerto Madero — frente de los diques"
  puerto: "Puerto Madero se lee como un frente gastronómico sobre ambos márgenes de los diques. La oferta se ordena a lo largo del agua e integra el paseo costero, con presencia en los dos bordes del corredor de diques. La representación cartográfica de detalle de este frente se encuentra en elaboración."
  estado_lectura: "lectura consolidada, con seguimiento"

# TXT-11
belgrano:
  titulo: "Belgrano y zonas en observación"
  bajada: "Sectores con actividad reconocible cuya lectura de conjunto se consolida."
  asset: "mapa_fase25_belgrano.png"
  lectura_titulo: "Lectura territorial"
  lectura: "Belgrano presenta varios sectores con actividad gastronómica reconocible —entre ellos el entorno del Barrio Chino, el Bajo Belgrano y Belgrano R—, cuya lectura de conjunto se encuentra en consolidación."
  observacion_titulo: "Zonas en observación"
  observacion: "La Dirección mantiene además en observación otras zonas de la Ciudad, entre ellas el área central, Recoleta y el eje Caseros–Barracas, que se irán incorporando a la lectura de detalle en próximas actualizaciones."
  estado_lectura: "lectura en consolidación"

# TXT-12
costanera:
  titulo: "Costanera Norte"
  bajada: "Una identidad gastronómica que se expresa en tramos separados del frente ribereño."
  lectura: "El frente ribereño de la Costanera Norte muestra una identidad gastronómica que se expresa en tramos separados, con tres sectores principales de actividad. Los espacios entre esos tramos responden a condiciones físicas del territorio —el aeroparque, los parques y la infraestructura costera— y no a una discontinuidad de la lectura."
  exploratoria_titulo: "Qué significa lectura exploratoria"
  exploratoria: "Una lectura exploratoria identifica interés territorial: señala dónde hay actividad que merece seguimiento, sin proponer todavía una delimitación. La Costanera Norte se presenta en esta categoría y no constituye un polo delimitado."
  territorio_titulo: "Las condiciones del territorio"
  territorio: "La discontinuidad del frente ribereño es un rasgo físico real: el aeroparque, los parques costeros y la infraestructura portuaria separan los tramos con actividad gastronómica. La lectura respeta esos vacíos en lugar de disimularlos."
  seguimiento_titulo: "Seguimiento"
  seguimiento: "La Dirección mantiene la zona en seguimiento y prevé profundizar su lectura a medida que se amplíe la base de evidencia territorial."
  estado_lectura: "lectura exploratoria"

# TXT-13 / TXT-19
proximos_pasos:
  titulo: "Próximos pasos"
  bajada: "Cómo continúa esta lectura territorial."
  items:
    - "Profundizar la lectura de detalle de Puerto Madero y San Telmo, incorporando la cartografía de presentación en elaboración."
    - "Consolidar la lectura de Belgrano y extender el análisis en detalle a Palermo, Recoleta y el eje Caseros–Barracas."
    - "Mantener el seguimiento del frente ribereño de la Costanera Norte y de las zonas en observación."
    - "Actualizar periódicamente la base de evidencia territorial que respalda esta lectura, con controles de calidad y revisión territorial."
  cierre: "La Dirección prevé una actualización de esta lectura territorial a medida que avancen las etapas de profundización."
  relacion_titulo: "Relación con la lectura general"
  relacion: "Esta pieza complementa la lectura territorial general elaborada por la Dirección: no la reemplaza. La lectura general ordena el conjunto de la Ciudad; los avances de detalle profundizan zonas seleccionadas con evidencia ampliada y se integran a la lectura general a medida que se consolidan."

# TXT-14
nota_metodologica:
  titulo: "Nota metodológica"
  bajada: "Fuentes, criterio de lectura y convenciones de representación."
  fuentes_titulo: "Cómo se construyó esta lectura"
  fuentes: "Se integraron fuentes públicas y una fuente externa auxiliar de localización, sometidas a controles de calidad, depuración y revisión territorial."
  representacion_titulo: "Qué representa cada elemento"
  representacion: "Cada zona se describe por su forma en el territorio —núcleo, corredor, frente, identidad en tramos— y, por separado, por el grado de consolidación de su lectura: consolidada, con seguimiento, en consolidación o exploratoria. Las franjas que acompañan a los ejes y frentes son convenciones de representación cartográfica, de carácter orientativo. Las estructuras representadas reúnen la parte más concentrada de la oferta relevada en cada zona; la oferta restante se considera contexto territorial y no se interpreta como ausencia de actividad."
  alcance_titulo: "Alcance"
  alcance: "Las áreas y ejes representados son referencias de lectura territorial elaboradas por la DGDGAS; no constituyen límites oficiales ni un registro de establecimientos. Las referencias a sectores y subzonas son lecturas editoriales de apoyo, no jerarquías validadas ni delimitaciones."
