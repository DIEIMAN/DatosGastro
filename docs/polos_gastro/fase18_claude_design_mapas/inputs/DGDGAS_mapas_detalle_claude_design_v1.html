document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

v style=\"min-height:100vh; background:#E7EAED; padding:40px 24px 80px; font-family:'Source Sans 3',system-ui,sans-serif; color:#1B2733;\">\n  <div style=\"max-width:1180px; margin:0 auto; display:flex; flex-direction:column; gap:20px;\">\n\n    <!-- ============ PORTADA ============ -->\n    <header style=\"background:#1F3B57; border-radius:5px; padding:44px 48px 42px; color:#DCE6EF; position:relative; overflow:hidden;\">\n      <div style=\"position:absolute; top:0; right:0; width:340px; height:100%; opacity:0.10; background-image:linear-gradient(#8FB6D6 1px,transparent 1px),linear-gradient(90deg,#8FB6D6 1px,transparent 1px); background-size:26px 26px; transform:rotate(-18deg) scale(1.6); transform-origin:top right;\"><\u002Fdiv>\n      <div style=\"position:relative;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:#E0A05A; margin-bottom:16px;\">DGDGAS · Dirección General de Desarrollo Gastronómico<\u002Fdiv>\n        <h1 style=\"font-family:'Libre Franklin',sans-serif; font-weight:600; font-size:34px; line-height:1.12; margin:0 0 12px; letter-spacing:-0.015em; color:#FFFFFF; max-width:760px;\">Mapas de detalle — Propuesta cartográfica editorial<\u002Fh1>\n        <p style=\"margin:0; font-size:16px; line-height:1.55; color:#AEC4D8; max-width:680px;\">Polos gastronómicos de la Ciudad de Buenos Aires. Sistema visual, mockups de los cinco mapas de detalle y reglas de implementación para pasar de una salida técnica a una pieza institucional legible.<\u002Fp>\n        <div style=\"display:flex; flex-wrap:wrap; gap:10px; margin-top:22px;\">\n          <span style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; padding:6px 12px; border:1px solid #3A5876; border-radius:3px; color:#AEC4D8;\">Borrador de diseño<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; padding:6px 12px; border:1px solid #3A5876; border-radius:3px; color:#AEC4D8;\">Referencia territorial · no delimita oficialmente<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; padding:6px 12px; border:1px solid #3A5876; border-radius:3px; color:#AEC4D8;\">Fecha de corte: 2026-06-30<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <!-- ============ DIAGNÓSTICO ============ -->\n    <section style=\"background:#FFFFFF; border:1px solid #DDE3E9; border-radius:5px; padding:34px 40px 36px;\">\n      <div style=\"display:flex; align-items:baseline; gap:14px; margin-bottom:18px;\">\n        <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:#C0762B; letter-spacing:0.04em;\">00<\u002Fspan>\n        <h2 style=\"font-family:'Libre Franklin',sans-serif; font-weight:600; font-size:22px; margin:0; letter-spacing:-0.01em; color:#1F3B57;\">Diagnóstico y criterio<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:28px;\">\n        <div>\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:#A23A2C; margin-bottom:12px;\">Qué falla hoy<\u002Fdiv>\n          <ul style=\"margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:9px; font-size:14.5px; line-height:1.5; color:#3C4B59;\">\n            <li style=\"display:flex; gap:9px;\"><span style=\"color:#A23A2C;\">✕<\u002Fspan>Barrios enteros pintados de un color plano: parece salida de script, no cartografía.<\u002Fli>\n            <li style=\"display:flex; gap:9px;\"><span style=\"color:#A23A2C;\">✕<\u002Fspan>Las subzonas no se distinguen; Palermo Soho, Hollywood y Cañitas quedan en una sola mancha.<\u002Fli>\n            <li style=\"display:flex; gap:9px;\"><span style=\"color:#A23A2C;\">✕<\u002Fspan>Sin sensación de trama urbana: no hay calles ni ejes que orienten.<\u002Fli>\n            <li style=\"display:flex; gap:9px;\"><span style=\"color:#A23A2C;\">✕<\u002Fspan>Etiquetas en cajitas flotantes que se pisan y no jerarquizan.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:#2F6E5B; margin-bottom:12px;\">Hacia dónde vamos<\u002Fdiv>\n          <ul style=\"margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:9px; font-size:14.5px; line-height:1.5; color:#3C4B59;\">\n            <li style=\"display:flex; gap:9px;\"><span style=\"color:#2F6E5B;\">✓<\u002Fspan>Callejero suave de fondo que da lectura de mapa urbano real.<\u002Fli>\n            <li style=\"display:flex; gap:9px;\"><span style=\"color:#2F6E5B;\">✓<\u002Fspan>Subzonas como protagonistas: áreas coloreadas, angulares, siguiendo avenidas.<\u002Fli>\n            <li style=\"display:flex; gap:9px;\"><span style=\"color:#2F6E5B;\">✓<\u002Fspan>Etiquetas grandes y bien ubicadas; borde discontinuo para lo \"a reforzar\".<\u002Fli>\n            <li style=\"display:flex; gap:9px;\"><span style=\"color:#2F6E5B;\">✓<\u002Fspan>Menciones de locales fuera del mapa, en caja lateral. Puntos sólo para hitos.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============ SISTEMA VISUAL ============ -->\n    <section style=\"background:#FFFFFF; border:1px solid #DDE3E9; border-radius:5px; padding:34px 40px 38px;\">\n      <div style=\"display:flex; align-items:baseline; gap:14px; margin-bottom:6px;\">\n        <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:#C0762B; letter-spacing:0.04em;\">01<\u002Fspan>\n        <h2 style=\"font-family:'Libre Franklin',sans-serif; font-weight:600; font-size:22px; margin:0; letter-spacing:-0.01em; color:#1F3B57;\">Sistema visual<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 26px; color:#566573; font-size:15px; max-width:760px; line-height:1.55;\">Un mismo lenguaje para los cinco mapas: trama de calles tenue, subzonas coloreadas por identidad, estado indicado por el borde, y menciones fuera del mapa.<\u002Fp>\n\n      <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:16px;\">\n\n        <!-- Paleta de subzonas -->\n        <div style=\"grid-column:span 2; border:1px solid #DDE3E9; border-radius:4px; padding:20px 22px;\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:#8A97A3; margin-bottom:16px;\">Paleta de subzonas · identidad<\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:14px;\">\n            <div style=\"display:flex; gap:10px; align-items:flex-start;\"><span style=\"width:34px; height:34px; border-radius:4px; background:#2F6E5B29; border:1.75px solid #2F6E5B; flex-shrink:0;\"><\u002Fspan><div><div style=\"font-size:13px; font-weight:600; color:#1B2733;\">Verde<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:#8A97A3;\">#2F6E5B<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex; gap:10px; align-items:flex-start;\"><span style=\"width:34px; height:34px; border-radius:4px; background:#3F7A8629; border:1.75px solid #3F7A86; flex-shrink:0;\"><\u002Fspan><div><div style=\"font-size:13px; font-weight:600; color:#1B2733;\">Teal<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:#8A97A3;\">#3F7A86<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex; gap:10px; align-items:flex-start;\"><span style=\"width:34px; height:34px; border-radius:4px; background:#2C7FB829; border:1.75px solid #2C7FB8; flex-shrink:0;\"><\u002Fspan><div><div style=\"font-size:13px; font-weight:600; color:#1B2733;\">Azul<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:#8A97A3;\">#2C7FB8<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex; gap:10px; align-items g:7px 0; border-bottom:1px solid #EDF1F4; font-size:13.5px; color:#566573;\">Moulin Bleu<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:16px; padding:12px 14px; background:#F4EEE1; border-left:3px solid #C0762B; border-radius:2px;\">\n            <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:#7E571A; margin-bottom:5px;\">Abasto<\u002Fdiv>\n            <div style=\"font-size:13px; color:#4C5964; line-height:1.45;\">Área a reforzar documentalmente. Se muestra separada del eje Corrientes; convendría validar su recorte antes de tratarla como polo propio.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Faside>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-top:14px; padding-top:12px; border-top:1px solid #EDF1F4;\">\n        <span style=\"font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:#A23A2C;\">Referencia territorial · eje y área aproximados · no delimita oficialmente polos<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:#9DB1C2;\">Base esquemática · DGDGAS · corte 2026-06-30<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============ MAPA 5 · BELGRANO ============ -->\n    <section style=\"background:#FFFFFF; border:1px solid #DDE3E9; border-radius:5px; padding:32px 36px 30px;\">\n      <div style=\"display:flex; align-items:baseline; gap:14px; margin-bottom:4px;\">\n        <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:#C0762B; letter-spacing:0.04em;\">Mapa 5<\u002Fspan>\n        <h2 style=\"font-family:'Libre Franklin',sans-serif; font-weight:600; font-size:22px; margin:0; letter-spacing:-0.01em; color:#1F3B57;\">Belgrano<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 22px; color:#566573; font-size:14.5px; max-width:680px; line-height:1.5;\">Una jerarquía visible: Barrio Chino style=\"display:flex; flex-direction:column; border-top:1px solid #EDF1F4;\">\n            <div style=\"padding:7px 0; border-bottom:1px solid #EDF1F4; font-size:13.5px; color:#566573;\">Ichisou<\u002Fdiv>\n            <div style=\"padding:7px 0; border-bottom:1px solid #EDF1F4; font-size:13.5px; color:#566573;\">Ramen Neko<\u002Fdiv>\n            <div style=\"padding:7px 0; border-bottom:1px solid #EDF1F4; font-size:13.5px; color:#566573;\">Ichiban<\u002Fdiv>\n            <div style=\"padding:7px 0; border-bottom:1px solid #EDF1F4; font-size:13.5px; color:#566573;\">BAO Kitchen<\u002Fdiv>\n            <div style=\"padding:7px 0; border-bottom:1px solid #EDF1F4; font-size:13.5px; color:#566573;\">Tori Tori<\u002Fdiv>\n            <div style=\"padding:7px 0; border-bottom:1px solid #EDF1F4; font-size:13.5px; color:#566573;\">La Mar<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:16px; padding:12px 14px; background:#EBF0F1; border-left:3px solid #3F7A86; border-radius:2px;\">\n            <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:#356974; margin-bottom:5px;\">Belgrano R<\u002Fdiv>\n            <div style=\"font-size:13px; color:#4C5964; line-height:1.45;\">Subzona a reforzar: sin evidencia de polo consolidado. Se muestra con borde discontinuo hasta contar con más documentación.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Faside>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-top:14px; padding-top:12px; border-top:1px solid #EDF1F4;\">\n        <span style=\"font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:#A23A2C;\">Referencia territorial · subzonas aproximadas · no delimita oficialmente polos<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:#9DB1C2;\">Base esquemática · DGDGAS · corte 2026-06-30<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============ REGLAS PARA CODEX ============ -->\n    <section style=\"background:#FFFFFF; border:1px solid #DDE3E9; border-radius:5px; padding:34px 40px 38px;\">\n      <div style=\"display:flex; align-items:baseline; gap:14px; margin-bottom:6px;\">\n        <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:#C0762B; letter-spacing:0.04em;\">02<\u002Fspan>\n        <h2 style=\"font-family:'Libre Franklin',sans-serif; font-weight:600; font-size:22px; margin:0; letter-spacing:-0.01em; color:#1F3B57;\">Reglas de implementación<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 26px; color:#566573; font-size:15px; max-width:760px; line-height:1.55;\">Parámetros concretos para reproducir estos mapas en el pipeline. Valores sobre un lienzo de referencia de 720×560; escalar proporcionalmente.<\u002Fp>\n\n      <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:16px;\">\n\n        <div style=\"border:1px solid #DDE3E9; border-radius:4px; padding:20px 22px;\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:#8A97A3; margin-bottom:12px;\">Tamaños de etiqueta<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:7px; font-size:13.5px; color:#3C4B59; line-height:1.4;\">\n            <div style=\"display:flex; justify-content:space-between; gap:12px;\"><span>Subzona principal<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace; color:#1F3B57;\">20–23 px · 600<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; justify-content:space-between; gap:12px;\"><span>Subzona menor / a reforzar<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace; color:#1F3B57;\">17–19 px · 500–600<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; justify-content:space-between; gap:12px;\"><span>Tag \"aproximada\"<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace; color:#1F3B57;\">8.5–9 px · mono<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; justify-content:space-between; gap:12px;\"><span>Hito<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace; color:#1F3B57;\">12–13.5 px · 500–600<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; justify-content:space-between; gap:12px;\"><span>Avenida<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace; color:#1F3B57;\">10–10.5 px · mono<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid #DDE3E9; border-radius:4px; padding:20px 22px;\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:#8A97A3; margin-bottom:12px;\">Colores y opacidades<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:7px; font-size:13.5px; color:#3C4B59; line-height:1.4;\">\n            <div style=\"display:flex; justify-content:space-between; gap:12px;\"><span>Relleno consolidada<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace; color:#1F3B57;\">color @ 15–20%<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; justify-content:space-between; gap:12px;\"><span>Relleno a reforzar<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace; color:#1F3B57;\">color @ 8–10%<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; justify-content:space-between; gap:12px;\"><span>Borde consolidada<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace; color:#1F3B57;\">1.9 px sólido<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; justify-content:space-between; gap:12px;\"><span>Borde a reforzar<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace; color:#1F3B57;\">1.5 px · dash 4 3<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; justify-content:space-between; gap:12px;\"><span>Grilla / avenidas / agua<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace; color:#1F3B57;\">#E8EDF1 / #D3DAE0 / #E6EDF3<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid #DDE3E9; border-radius:4px; padding:20px 22px;\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:#8A97A3; margin-bottom:12px;\">Jerarquía visual (del fondo al frente)<\u002Fdiv>\n          <ol style=\"margin:0; padding-left:18px; font-size:13.5px; color:#3C4B59; line-height:1.5;\">\n            <li>Fondo #FAFBFC + grilla tenue rotada al ángulo del barrio.<\u002Fli>\n            <li>Agua y avenidas nombradas (soporte, nunca protagonistas).<\u002Fli>\n            <li>Áreas de subzona coloreadas (protagonistas).<\u002Fli>\n            <li>Etiquetas grandes de subzona + tag \"aproximada\".<\u002Fli>\n            <li>Hitos (rombo) — al final, ≤2 por mapa.<\u002Fli>\n          <\u002Fol>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid #DDE3E9; border-radius:4px; padding:20px 22px;\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:#8A97A3; margin-bottom:12px;\">Puntos: cuándo mostrar / ocultar<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:8px; font-size:13.5px; color:#3C4B59; line-height:1.45;\">\n            <div style=\"display:flex; gap:8px;\"><span style=\"color:#2F6E5B;\">✓<\u002Fspan>Sólo hitos urbanos (mercado, arco, obelisco, Faena): rombo navy.<\u002Fdiv>\n            <div style=\"display:flex; gap:8px;\"><span style=\"color:#2F6E5B;\">✓<\u002Fspan>Máx. 2 hitos por mapa; siempre con etiqueta.<\u002Fdiv>\n            <div style=\"display:flex; gap:8px;\"><span style=\"color:#A23A2C;\">✕<\u002Fspan>Nunca puntos de locales sobre el mapa.<\u002Fdiv>\n            <div style=\"display:flex; gap:8px;\"><span style=\"color:#A23A2C;\">✕<\u002Fspan>Nada de place_id, rating ni campos técnicos: los locales van a la caja lateral.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid #DDE3E9; border-radius:4px; padding:20px 22px;\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:#8A97A3; margin-bottom:12px;\">Evitar superposición de etiquetas<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:8px; font-size:13.5px; color:#3C4B59; line-height:1.45;\">\n            <div style=\"display:flex; gap:8px;\"><span style=\"color:#2C7FB8;\">›<\u002Fspan>Etiqueta dentro del área si su ancho supera ~140 px; si no, colgarla afuera con línea guía.<\u002Fdiv>\n            <div style=\"display:flex; gap:8px;\"><span style=\"color:#2C7FB8;\">›<\u002Fspan>Separación mínima entre etiquetas: 12 px. Dos etiquetas nunca se tocan.<\u002Fdiv>\n            <div style=\"display:flex; gap:8px;\"><span style=\"color:#2C7FB8;\">›<\u002Fspan>Línea guía: 1–1.4 px #8A97A3, termina en punto de 4 px sobre el área. Sólo si la etiqueta no cabe.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid #DDE3E9; border-radius:4px; padding:20px 22px;\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:#8A97A3; margin-bottom:12px;\">Decisiones de forma<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:9px; font-size:13.5px; color:#3C4B59; line-height:1.45;\">\n            <div><strong style=\"color:#1B2733;\">Área → eje<\u002Fstrong> cuando el fenómeno sigue una avenida (Corrientes) o el río/diques (Puerto Madero): usar banda longitudinal, no polígono compacto.<\u002Fdiv>\n            <div><strong style=\"color:#1B2733;\">Dejar \"a reforzar / a revisar\"<\u002Fstrong> cuando la documentación es débil o no hay recorte (Belgrano R, Bajo Belgrano, Abasto): borde discontinuo + relleno 8–10% + tag; nunca borde sólido.<\u002Fdiv>\n            <div><strong style=\"color:#1B2733;\">Contexto<\u002Fstrong> (subzonas no protagonistas): sólo contorno punteado tenue y etiqueta gris, sin relleno.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n\n      <!-- Recomendación de layout -->\n      <div style=\"margin-top:34px;\">\n        <div style=\"display:flex; align-items:baseline; gap:14px; margin-bottom:6px;\">\n          <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:#C0762B; letter-spacing:0.04em;\">03<\u002Fspan>\n          <h2 style=\"font-family:'Libre Franklin',sans-serif; font-weight:600; font-size:22px; margin:0; letter-spacing:-0.01em; color:#1F3B57;\">Recomendación de layout<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 22px; color:#566573; font-size:15px; max-width:760px; line-height:1.55;\">Si las subzonas deben ser protagonistas, el mapa necesita aire. Recomendación: <strong style=\"color:#1B2733;\">C + D combinados<\u002Fstrong> — cada mapa de detalle en página propia, con mapa grande y caja de menciones al costado; caja abajo cuando la lista es larga.<\u002Fp>\n\n        <div style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:14px;\">\n\n          <div style=\"border:1px solid #DDE3E9; border-radius:4px; padding:16px 16px 18px; opacity:0.7;\">\n            <div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8A97A3; margin-bottom:10px;\">Opción A<\u002Fdiv>\n            <svg viewBox=\"0 0 120 80\" style=\"width:100%; height:auto; margin-bottom:10px;\"><rect width=\"120\" height=\"80\" fill=\"#F4F6F8\"><\u002Frect><rect x=\"10\" y=\"10\" width=\"58\" height=\"60\" fill=\"#DCE3EA\"><\u002Frect><rect x=\"74\" y=\"10\" width=\"36\" height=\"60\" fill=\"#EAEFF3\"><\u002Frect><\u002Fsvg>\n            <div style=\"font-size:13px; font-weight:600; color:#1B2733; margin-bottom:3px;\">Mantener actual<\u002Fdiv>\n            <div style=\"font-size:12px; color:#8A97A3; line-height:1.4;\">Mapa chico + caja grande. Es el problema de hoy.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"border:1px solid #DDE3E9; border-radius:4px; padding:16px 16px 18px;\">\n            <div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8A97A3; margin-bottom:10px;\">Opción B<\u002Fdiv>\n            <svg viewBox=\"0 0 120 80\" style=\"width:100%; height:auto; margin-bottom:10px;\"><rect width=\"120\" height=\"80\" fill=\"#F4F6F8\"><\u002Frect><rect x=\"10\" y=\"10\" width=\"74\" height=\"60\" fill=\"#BFD0DE\"><\u002Frect><rect x=\"90\" y=\"10\" width=\"20\" height=\"60\" fill=\"#EAEFF3\"><\u002Frect><\u002Fsvg>\n            <div style=\"font-size:13px; font-weight:600; color:#1B2733; margin-bottom:3px;\">Agrandar mapa<\u002Fdiv>\n            <div style=\"font-size:12px; color:#8A97A3; line-height:1.4;\">Piso mínimo aceptable dentro del layout actual.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"border:2px solid #1F3B57; border-radius:4px; padding:15px 15px 17px; position:relative;\">\n            <div style=\"position:absolute; top:-10px; right:12px; background:#1F3B57; color:#fff; font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.08em; padding:3px 8px; border-radius:2px;\">RECOMENDADO<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; color:#1F3B57; margin-bottom:10px;\">Opción C + D<\u002Fdiv>\n            <svg viewBox=\"0 0 120 80\" style=\"width:100%; height:auto; margin-bottom:10px;\"><rect width=\"120\" height=\"80\" fill=\"#F4F6F8\"><\u002Frect><rect x=\"10\" y=\"8\" width=\"70\" height=\"64\" fill=\"#2C7FB8\" opacity=\"0.55\"><\u002Frect><rect x=\"86\" y=\"8\" width=\"24\" height=\"42\" fill=\"#DCE3EA\"><\u002Frect><rect x=\"86\" y=\"54\" width=\"24\" height=\"18\" fill=\"#EFE6D6\"><\u002Frect><\u002Fsvg>\n            <div style=\"font-size:13px; font-weight:600; color:#1B2733; margin-bottom:3px;\">Página propia + caja<\u002Fdiv>\n            <div style=\"font-size:12px; color:#566573; line-height:1.4;\">Mapa protagonista, menciones al costado. Caja abajo si es larga.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"border:1px solid #DDE3E9; border-radius:4px; padding:16px 16px 18px;\">\n            <div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8A97A3; margin-bottom:10px;\">Opción D<\u002Fdiv>\n            <svg viewBox=\"0 0 120 80\" style=\"width:100%; height:auto; margin-bottom:10px;\"><rect width=\"120\" height=\"80\" fill=\"#F4F6F8\"><\u002Frect><rect x=\"10\" y=\"8\" width=\"100\" height=\"46\" fill=\"#BFD0DE\"><\u002Frect><rect x=\"10\" y=\"58\" width=\"100\" height=\"14\" fill=\"#EAEFF3\"><\u002Frect><\u002Fsvg>\n            <div style=\"font-size:13px; font-weight:600; color:#1B2733; margin-bottom:3px;\">Mapa + caja abajo<\u002Fdiv>\n            <div style=\"font-size:12px; color:#8A97A3; line-height:1.4;\">Ideal para mapas anchos (Corrientes, Puerto Madero).<\u002Fdiv>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n\n        <div style=\"margin-top:18px; padding:16px 20px; background:#F6F4EF; border-left:3px solid #C0762B; border-radius:2px; font-size:13.5px; color:#4C5964; line-height:1.5;\">\n          <strong style=\"color:#1B2733;\">En una palabra:<\u002Fstrong> página completa por mapa (C), mapa grande a la izquierda y menciones al costado (D). Palermo y Corrientes/Abasto justifican página propia por densidad; para los mapas anchos y longitudinales (Puerto Madero, Corrientes) la caja de menciones puede ir abajo. Nunca volver al mapa chico con caja dominante de la opción A.\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <footer style=\"text-align:center; padding:16px 0 0; font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8A97A3; line-height:1.6;\">\n      DGDGAS — Dirección General de Desarrollo Gastronómico · Gobierno de la Ciudad de Buenos Aires<br>\n      Base cartográfica esquemática de referencia. No representa límites oficiales de polos ni geometría de plataformas privadas.\n    <\u002Ffooter>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
