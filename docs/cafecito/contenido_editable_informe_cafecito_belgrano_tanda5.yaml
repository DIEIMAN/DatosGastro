  aspectos:
    titulo: "A. Aspectos a considerar para próximas ediciones"
    intro: "A modo de hipótesis para próximas ediciones, podrían considerarse los siguientes aspectos:"
    puntos:
      - "Podría sostenerse la difusión por Instagram, que concentró la mayor parte de las menciones de llegada."
      - "Podría evaluarse reforzar la difusión física en locales o cafeterías adheridas, especialmente si se busca complementar el alcance de Instagram."
      - "Podría ampliarse la cantidad de respuestas en futuras ediciones, definiendo puntos y horarios de relevamiento, para obtener una base más amplia."
      - "Los intereses declarados (vino, pastelería, food trucks, café, ferias) podrían tomarse como insumo tentativo para pensar la programación futura."
    nota: "Estas son consideraciones tentativas a partir de una muestra acotada; no constituyen conclusiones definitivas."

  anexo_red:
    titulo: "B. Anexo: red de cafeterías vinculadas"
    intro: "Como complemento de los resultados de la encuesta, se incluye una lectura territorial de las cafeterías vinculadas al evento. Esta sección es complementaria y no forma parte de los resultados del formulario."
    mapa_sedes_titulo: "Sedes de cafeterías vinculadas en CABA"
    mapa_combinado_titulo: "Sedes de cafeterías y respuestas por comuna"
    en_numeros_titulo: "La red en números"
    en_numeros:
      - "14 marcas relevadas."
      - "39 sedes mapeables en CABA."
      - "2 marcas quedaron fuera del mapa por falta de información pública suficiente."
    nota_prudente: "Sedes públicas conocidas en CABA de marcas/cafeterías vinculadas al evento. No implica que todas esas sedes hayan participado físicamente en la edición relevada."

  notas_internas:
    titulo: "C. Notas metodológicas y variables no usadas"
    intro: "Registro interno de decisiones metodológicas de la revisión tanda 4. Todas se derivan del diccionario de preguntas del formulario y de los outputs ya existentes; no agregan datos nuevos."
    puntos:
      - "Consentimiento de contacto (columna C del formulario): se excluyó por completo de la versión pública de esta tanda, incluido su gráfico y toda mención en lecturas y resumen. Hay dudas sobre el orden y la consistencia de ese dato; no se analiza hasta que se revise."
      - "Correo electrónico (columna B): dato personal; excluido de todo output, se usó solo como control de completitud."
      - "Marca temporal (columna A): dato sensible; se publica únicamente agregado por día y franja horaria, en porcentajes."
      - "Barrio o localidad (columna G): texto libre sensible; se publica solo agregado, con umbral de frecuencia mínima de 2 menciones, sin listar respuestas individuales."
      - "Multi-respuesta (columnas J y L): en la versión pública tanda 2 los porcentajes se normalizaron sobre el total de menciones registradas, de modo que suman 100%. En versiones anteriores se calculaban sobre el total de respondentes (y podían superar 100%)."
      - "Canales con cero menciones: el PDF del formulario no documenta el listado cerrado de opciones y el XLSX no contiene validaciones. En la Tanda 4 se incorpora 'Locales o cafeterías adheridas' como categoría esperada/no observada con 0 menciones, sin alterar los datos fuente."
      - "Residencia: Gran Buenos Aires y Provincia de Buenos Aires (fuera del GBA) se unifican como 'Provincia de Buenos Aires' solo en la presentación; no se reasignan respuestas."
      - "Etiqueta 'Con amigos/as' (columna I, literal del formulario): en el PDF público se muestra 'Con amigos'; es un cambio de display, la categoría original se conserva en los datos."
      - "Limitación general: 79 respuestas obtenidas durante el evento; describen a quienes completaron el formulario y no constituyen una muestra representativa del total de asistentes."
