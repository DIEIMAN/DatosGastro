  # ------------------------------------------------ 2. Resumen ejecutivo
  resumen:
    titulo: "2. Resumen ejecutivo"
    intro: "Sobre un total de {n} respuestas obtenidas durante el evento, los principales resultados son los siguientes:"
    puntos:
      - "Perfil: el grupo de 25 a 34 años fue el más mencionado ({edad_top_pct}) y las personas de 18 a 44 años reúnen el {p1844_pct} de las respuestas, con mayor presencia de mujeres ({mujer_pct}). **Predominó un público joven-adulto, mayormente femenino.**"
      - "Residencia: el {caba_pct} declaró residir en CABA y Belgrano fue el barrio más mencionado. **El evento convocó sobre todo público de cercanía.**"
      - "Vínculo con eventos de la Ciudad: el {recurrente_pct} ya había participado de otros eventos gastronómicos y el {primera_pct} asistía por primera vez. **La edición combinó público habitual con asistentes nuevos.**"
      - "Canales de información: Instagram concentró el {instagram_m_pct} de las menciones, seguido por la recomendación de amigos, familia o conocidos ({amigos_m_pct}) y el paso por la zona ({paso_m_pct}). **Instagram fue el canal dominante; los locales y cafeterías adheridas casi no aparecen como vía de información.**"
      - "Asistencia: en pareja ({pareja_pct}), con amigos ({amigos_acomp_pct}) o con familia ({familia_pct}). **El evento funcionó, sobre todo, como una salida compartida.**"
      - "Motivos: probar café o cafeterías ({cafe_pct}) y pasear o hacer una salida ({paseo_pct}) encabezan las respuestas."
      - "Intereses a futuro: vino ({vino_m_pct} de las menciones) y pastelería ({pasteleria_m_pct}) lideran, seguidas por food trucks ({food_trucks_m_pct}), café ({cafe_futuro_m_pct}) y ferias y mercados ({ferias_m_pct}). **Las personas encuestadas declararon interés en ampliar la programación gastronómica hacia propuestas como vino y pastelería.**"
    nota_titulo: "Aclaraciones del informe"
    nota: "Los resultados corresponden a 79 respuestas obtenidas durante el evento. Describen a quienes completaron el formulario y no permiten inferir resultados sobre el total de asistentes."

