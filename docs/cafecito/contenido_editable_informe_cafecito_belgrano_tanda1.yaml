# ---------------------------------------------------------------------------
# CONTENIDO EDITABLE — Informe Cafecito BA en tu barrio · Edición Belgrano
# REVISIÓN TANDA 1 (DGDGAS)
# ---------------------------------------------------------------------------
# Primera tanda de correcciones editoriales sobre la Revisión 4. Este archivo
# y su script (generar_informe_cafecito_belgrano_tanda1.py) inician la
# plantilla reusable para informes de encuestas de eventos: para una nueva
# edición se cambian los datos del evento, las fechas y las lecturas.
#
# Cambios de la tanda 1 respecto de la Revisión 4:
#   - Encabezado institucional arriba en todas las páginas interiores
#     (DGDGAS · evento · tipo de informe · fecha del informe).
#   - Número de página abajo a la derecha.
#   - Portada con "Edición Belgrano", fechas del evento y bloque
#     "Datos generales del evento". Sin rótulo "Presenta".
#   - Página 3: párrafo metodológico en lugar de la ficha rígida;
#     distribución por día y franja en porcentajes (sin absolutos).
#   - Página 4: "Resumen ejecutivo" en lugar de "Preguntas del formulario".
#   - Páginas de resultados: el subtítulo de cada bloque es SOLO la pregunta
#     entre comillas (sin "Pregunta analizada", "Tipo", "Qué permite
#     observar" ni "Fuente").
#   - Residencia: título "Lugar de residencia", subsección "Residencia",
#     GBA unido con Provincia de Buenos Aires, top de barrios solo en %.
#
# Qué SÍ se puede editar:
#   - Cualquier texto entre comillas.
#   - Los ítems de las listas (líneas que empiezan con "- ").
#
# Qué NO tocar:
#   - Los nombres de las claves (antes de los dos puntos ":").
#   - La indentación.
#   - Los marcadores {clave} → son números calculados desde los datos.
#
# Regenerar el PDF (NO pisa ninguna versión anterior):
#   .venv/Scripts/python.exe scripts/cafecito/generar_informe_cafecito_belgrano_tanda1.py
# ---------------------------------------------------------------------------

marca: "DGDGAS"
fecha_documento: "29 de junio de 2026"

institucion:
  sigla: "DGDGAS"
  nombre: "Dirección General de Desarrollo Gastronómico"
  marco: "Gobierno de la Ciudad de Buenos Aires · BA Capital Gastronómica"

evento:
  nombre: "Cafecito BA en tu barrio"
  edicion: "Edición Belgrano"
  lugar: "La Glorieta de Barrancas de Belgrano"
  direccion: "11 de Septiembre y Echeverría, CABA"
  fechas: "sábado 27 y domingo 28 de junio de 2026"

# Encabezado de las páginas interiores (todas menos la portada).
encabezado:
  izquierda: "DGDGAS · Cafecito BA en tu barrio"
  derecha: "Resultados de encuestas · 29 de junio de 2026"

paginas:

  # ------------------------------------------------------------ Portada
  portada:
    kicker_marca: "DGDGAS – Dirección General de Desarrollo Gastronómico"
    kicker_tipo: "Resultados de encuestas · 29 de junio de 2026"
    titulo: "Cafecito BA\nen tu barrio"
    edicion: "Edición Belgrano"
    subtitulo: "Resultados de encuestas realizadas durante el evento, sábado 27 y domingo 28 de junio de 2026."
    datos_titulo: "Datos generales del evento"
    dato_evento: "Cafecito BA en tu barrio — edición Belgrano"
    dato_fechas: "sábado 27 y domingo 28 de junio de 2026"
    dato_modalidad: "Relevamiento presencial durante el evento"
    dato_respuestas: "{n}"
    parrafo: "El informe reúne los resultados de las encuestas realizadas al público durante Cafecito BA en tu barrio — edición Belgrano."

  # ------------------------------------------------------------ Índice
  indice:
    titulo: "Índice"
    subtitulo: "Contenido del informe de resultados."
    entradas:
      - num: "1"
        texto: "Metodología del relevamiento"
        pagina: "3"
      - num: "2"
        texto: "Resumen ejecutivo"
        pagina: "4"
      - num: "3"
        texto: "Perfil de las personas encuestadas"
        pagina: "5"
      - num: "4"
        texto: "Lugar de residencia"
        pagina: "6"
      - num: "4.1"
        texto: "Residencia"
        pagina: "6"
        sub: "si"
      - num: "4.2"
        texto: "Barrios y localidades más mencionados"
        pagina: "6"
        sub: "si"
      - num: "5"
        texto: "Vínculo previo con eventos de la Ciudad"
        pagina: "7"
      - num: "6"
        texto: "Canales de llegada"
        pagina: "8"
      - num: "7"
        texto: "Acompañamiento en el evento"
        pagina: "9"
      - num: "8"
        texto: "Motivaciones e intereses del momento"
        pagina: "10"
      - num: "9"
        texto: "Intereses para próximas ediciones"
        pagina: "11"
      - num: "10"
        texto: "Síntesis de resultados observados"
        pagina: "12"
      - num: "11"
        texto: "Aspectos a considerar para próximas ediciones"
        pagina: "13"
      - num: "12"
        texto: "Anexo: red de cafeterías vinculadas"
        pagina: "14"

  # ------------------------------------- 1. Metodología del relevamiento
  metodologia:
    titulo: "1. Metodología del relevamiento"
    subtitulo: "Cómo se realizó la encuesta y cómo se distribuyeron las respuestas."
    parrafo: "Las preguntas fueron realizadas por personal de la {sigla} durante Cafecito BA en tu barrio — edición Belgrano, que se desarrolló el sábado 27 y el domingo 28 de junio de 2026 en La Glorieta de Barrancas de Belgrano. El relevamiento se hizo de forma presencial durante el evento: el equipo contaba con el formulario digital en sus celulares y completaba las respuestas a partir de lo informado por las personas encuestadas. En total se obtuvieron {n} respuestas."
    distribucion_titulo: "Distribución de las respuestas por día y franja horaria"
    distribucion_intro: "Según el horario de carga registrado, las respuestas se distribuyeron de la siguiente manera (en porcentaje del total):"
    distribucion_nota: "Porcentajes calculados sobre el total de respuestas con horario de carga registrado. El sábado concentró el {sabado_pct} de las respuestas y el domingo el {domingo_pct}."

  # ------------------------------------------------ 2. Resumen ejecutivo
  resumen:
    titulo: "2. Resumen ejecutivo"
    subtitulo: "Síntesis de los principales resultados del relevamiento."
    intro: "Sobre un total de {n} respuestas obtenidas durante el evento, los principales resultados son los siguientes:"
    puntos:
      - "Perfil: el grupo de 25 a 34 años fue el más mencionado ({edad_top_pct}) y las personas de 18 a 44 años reúnen el {p1844_pct} de las respuestas, con mayor presencia de mujeres ({mujer_pct})."
      - "Residencia: el {caba_pct} de las personas encuestadas declaró residir en CABA. Belgrano fue el barrio más mencionado, seguido a distancia por Caballito, Núñez, Saavedra y Palermo."
      - "Vínculo con eventos de la Ciudad: el {recurrente_pct} ya había participado de otros eventos gastronómicos y el {primera_pct} asistía por primera vez."
      - "Canales de llegada: Instagram fue el canal más mencionado ({instagram_pct}), seguido por la recomendación de amigos, familia o conocidos ({amigos_pct}) y por el paso por la zona ({paso_pct})."
      - "Acompañamiento: la gran mayoría asistió acompañada, en pareja ({pareja_pct}), con amigos o amigas ({amigos_acomp_pct}) o con familia ({familia_pct})."
      - "Motivación principal: probar café o cafeterías fue el atractivo más mencionado ({cafe_pct}), seguido por pasear o hacer una salida ({paseo_pct})."
      - "Intereses a futuro: vino ({vino_pct}) y pastelería ({pasteleria_pct}) encabezan las menciones, seguidas por food trucks, café y ferias y mercados."
      - "Contacto: el {contacto_pct} de las respuestas válidas aceptó recibir información sobre próximos eventos y novedades gastronómicas de la Ciudad."
    nota_titulo: "Cómo leer este resumen"
    nota: "Resultados agregados sobre las respuestas obtenidas durante el evento. La cantidad de respuestas es acotada y describe a quienes completaron el formulario; no constituye una muestra representativa del total de asistentes."

  # ------------------------------- 3. Perfil de las personas encuestadas
  perfil:
    titulo: "3. Perfil de las personas encuestadas"
    subtitulo: "Edad y género de quienes respondieron la encuesta."
    pregunta_edad: "¿Cuál es tu rango de edad?"
    pregunta_genero: "¿Con qué género te identificás?"
    lectura: "El grupo de 25 a 34 años fue el más mencionado, con el {edad_top_pct} de las respuestas. En conjunto, las personas de 18 a 44 años reúnen el {p1844_pct} de las respuestas. Entre quienes respondieron se registra una mayor presencia de mujeres ({mujer_pct})."

  # ----------------------------------------- 4. Lugar de residencia
  residencia:
    titulo: "4. Lugar de residencia"
    subtitulo: "Zona de residencia y barrios o localidades que declararon las personas encuestadas."
    sub_a_titulo: "4.1 Residencia"
    pregunta_a: "¿Dónde vivís actualmente?"
    sub_b_titulo: "4.2 Barrios y localidades más mencionados"
    pregunta_b: "Indicanos tu barrio o localidad"
    barrios_nota: "Pregunta abierta. Resultados agrupados para lectura agregada."
    lectura: "La mayor parte de las respuestas corresponde a personas que declararon residir en CABA ({caba_pct}); el {pba_pct} declaró residir en la provincia de Buenos Aires. Entre los barrios y localidades, Belgrano fue el más mencionado, seguido a distancia por Caballito, Núñez, Saavedra y Palermo. El resto se reparte entre numerosos barrios y localidades con pocas menciones cada uno."

  # ------------------------- 5. Vínculo previo con eventos de la Ciudad
  vinculo:
    titulo: "5. Vínculo previo con eventos de la Ciudad"
    subtitulo: "Primera asistencia o participación previa, y aceptación de contacto."
    pregunta_primera: "¿Es la primera vez que venís a un evento gastronómico de la Ciudad?"
    pregunta_contacto: "¿Aceptás recibir información sobre próximos eventos y novedades gastronómicas de la Ciudad?"
    lectura: "El {recurrente_pct} de las respuestas indica que ya había participado de otros eventos gastronómicos de la Ciudad, mientras que el {primera_pct} corresponde a primeras asistencias. Entre las respuestas válidas, el {contacto_pct} aceptó recibir información sobre próximos eventos."

  # ----------------------------------------- 6. Canales de llegada
  canales:
    titulo: "6. Canales de llegada"
    subtitulo: "Canales declarados a través de los cuales el público llegó al evento."
    pregunta: "¿Cómo te enteraste del evento?"
    nota_multi: "Esta pregunta permitía seleccionar más de una opción. Por eso los resultados se muestran como menciones: cada porcentaje indica qué proporción de personas marcó esa opción y la suma puede superar el 100%."
    lectura: "Instagram fue el canal más mencionado ({instagram_pct}), seguido por la recomendación de amigos, familia o conocidos ({amigos_pct}) y por el paso por la zona ({paso_pct}). Los locales o cafeterías adheridas aparecen con muy pocas menciones como vía de llegada."

  # ----------------------------- 7. Acompañamiento en el evento
  acompanamiento:
    titulo: "7. Acompañamiento en el evento"
    subtitulo: "Con quién asistió el público encuestado."
    pregunta: "¿Con quién viniste al evento?"
    lectura: "La mayoría de las respuestas declara haber asistido acompañada: en pareja ({pareja_pct}), con amigos o amigas ({amigos_acomp_pct}) o con familia ({familia_pct}). La asistencia en solitario aparece con muy pocas menciones."

  # ----------------------------- 8. Motivaciones e intereses del momento
  motivaciones:
    titulo: "8. Motivaciones e intereses del momento"
    subtitulo: "Qué fue lo que más le interesó del evento al público encuestado."
    pregunta: "¿Qué fue lo que más te interesó del evento?"
    lectura: "El atractivo más mencionado fue probar café o cafeterías ({cafe_pct}), seguido por pasear o hacer una salida ({paseo_pct}). El resto de las respuestas se reparte entre conocer propuestas nuevas y otros motivos."

  # ----------------------- 9. Intereses para próximas ediciones
  intereses:
    titulo: "9. Intereses para próximas ediciones"
    subtitulo: "Tipos de eventos gastronómicos que el público mencionó como de interés."
    pregunta: "¿Qué tipo de eventos gastronómicos te interesa que se realicen próximamente?"
    nota_multi: "Esta pregunta permitía seleccionar más de una opción. Por eso los resultados se muestran como menciones: cada porcentaje indica qué proporción de personas marcó esa opción y la suma puede superar el 100%."
    lectura: "Entre las menciones, las más frecuentes fueron vino ({vino_pct}) y pastelería ({pasteleria_pct}), seguidas por food trucks ({food_trucks_pct}), café ({cafe_futuro_pct}) y ferias y mercados ({ferias_pct}). Se leen como intereses declarados, no como preferencias excluyentes."

  # ------------------------ 10. Síntesis de resultados observados
  sintesis:
    titulo: "10. Síntesis de resultados observados"
    subtitulo: "Principales resultados descriptos en el informe."
    intro: "A partir de las respuestas obtenidas se observa lo siguiente:"
    puntos:
      - "Respondió mayormente público de entre 18 y 44 años ({p1844_pct} de las respuestas), con presencia destacada de mujeres ({mujer_pct})."
      - "La mayor parte de las personas encuestadas declaró residir en CABA ({caba_pct}); Belgrano fue el barrio más mencionado."
      - "El {recurrente_pct} ya había participado de otros eventos gastronómicos de la Ciudad y el {primera_pct} asistía por primera vez."
      - "Instagram fue el canal de llegada más mencionado ({instagram_pct}); la recomendación personal y el paso por la zona también aparecen."
      - "El {contacto_pct} de las respuestas válidas aceptó recibir información sobre próximos eventos."
      - "Entre los intereses a futuro, vino y pastelería fueron los más mencionados."
    nota: "Nota: resultados agregados sobre las respuestas obtenidas. La cantidad de respuestas es acotada y corresponde a quienes completaron el formulario durante el evento."

  # ------------------ 11. Aspectos a considerar para próximas ediciones
  aspectos:
    titulo: "11. Aspectos a considerar para próximas ediciones"
    subtitulo: "Posibles líneas de trabajo, planteadas de manera tentativa."
    intro: "A modo de hipótesis para próximas ediciones, podrían considerarse los siguientes aspectos:"
    puntos:
      - "Podría sostenerse la difusión por Instagram, que concentró la mayor parte de las menciones de llegada."
      - "Podría evaluarse reforzar la difusión física en locales o cafeterías adheridas, especialmente si se busca complementar el alcance de Instagram."
      - "Sería posible aprovechar la disposición a recibir información de quienes aceptaron contacto, para comunicar próximos eventos."
      - "Podría ampliarse la cantidad de respuestas en futuras ediciones, definiendo puntos y horarios de relevamiento, para obtener una base más amplia."
      - "Los intereses declarados (vino, pastelería, food trucks, café, ferias) podrían tomarse como insumo tentativo para pensar la programación futura."
    nota: "Estas son consideraciones tentativas a partir de una muestra acotada; no constituyen conclusiones definitivas."

  # ------------------ 12. Anexo: red de cafeterías vinculadas
  anexo_red:
    titulo: "12. Anexo: red de cafeterías vinculadas"
    subtitulo: "Material complementario sobre sedes de cafeterías vinculadas al evento."
    intro: "Como complemento de los resultados de la encuesta, se incluye una lectura territorial de las cafeterías vinculadas al evento. Esta sección es complementaria y no forma parte de los resultados del formulario."
    mapa_sedes_titulo: "Sedes de cafeterías vinculadas en CABA"
    mapa_combinado_titulo: "Sedes de cafeterías y respuestas por comuna"
    en_numeros_titulo: "La red en números"
    en_numeros:
      - "14 marcas relevadas."
      - "39 sedes mapeables en CABA."
      - "2 marcas quedaron fuera del mapa por falta de información pública suficiente."
    nota_prudente: "Sedes públicas conocidas en CABA de marcas/cafeterías vinculadas al evento. No implica que todas esas sedes hayan participado físicamente en la edición relevada."
