# ---------------------------------------------------------------------------
# CONTENIDO EDITABLE — Informe Cafecito · REVISIÓN 2 (DGDGAS)
# ---------------------------------------------------------------------------
# Segunda revisión del informe Cafecito. Mantiene el enfoque de RESULTADOS de
# encuesta de la revisión 1 (datos duros, preguntas, porcentajes, lectura
# descriptiva, recomendaciones en potencial) y aplica:
#   - Marca institucional DGDGAS (se quita "DataGastro" de todo el PDF público).
#   - Portada limpia, sin información duplicada.
#   - Índice con números de página.
#   - Datos generales sin la nota de horario.
#   - Preguntas del formulario en una sola página compacta.
#   - Página de perfil reordenada (edad y género sin solapamientos).
#
# Este archivo contiene SOLO los textos visibles del PDF. No toca el final, el
# editable test ni la revisión 1.
#
# Qué SÍ se puede editar:
#   - Cualquier texto entre comillas.
#   - Los ítems de las listas (líneas que empiezan con "- ").
#
# Qué NO tocar:
#   - Los nombres de las claves (antes de los dos puntos ":").
#   - La indentación.
#   - Los marcadores {clave} → son números calculados desde los datos. Si los
#     borrás, el número desaparece. Conservá el nombre exacto entre llaves.
#
# Regenerar el PDF de revisión 2 (NO pisa el final, el test ni la revisión 1):
#   python scripts/cafecito/generar_informe_cafecito_revision_2.py
#
# Más detalle en: docs/cafecito/COMO_EDITAR_INFORME_CAFECITO.md
# ---------------------------------------------------------------------------

# Marca institucional del PDF público. Ya NO es DataGastro.
marca: "DGDGAS"
fecha_documento: "Junio de 2026"
footer: "DGDGAS · Cafecito BA en tu barrio · Resultados de encuestas"

# Área institucional que presenta el informe.
institucion:
  sigla: "DGDGAS"
  nombre: "Dirección General de Desarrollo Gastronómico"
  marco: "Gobierno de la Ciudad de Buenos Aires · BA Capital Gastronómica"

# Datos del evento (confirmados en la comunicación oficial del evento).
evento:
  nombre: "Cafecito BA en tu barrio"
  lugar: "La Glorieta de Barrancas de Belgrano"
  direccion: "11 de Septiembre y Echeverría, CABA"
  fecha_sabado: "Sábado 27 de junio de 2026, de 10:00 a 18:30 h"
  fecha_domingo: "Domingo 28 de junio de 2026, de 10:00 a 18:00 h"

paginas:

  # ------------------------------------------------------------ 1. Portada
  portada:
    kicker_marca: "DGDGAS – Dirección General de Desarrollo Gastronómico"
    kicker_tipo: "Informe de resultados"
    titulo: "Cafecito BA\nen tu barrio"
    subtitulo: "Resultados de encuestas realizadas durante el evento"
    descripcion: "El informe presenta los resultados de las encuestas realizadas al público durante el evento Cafecito BA en tu barrio. Describe quiénes respondieron la encuesta, dónde declararon residir, cómo se enteraron del evento y qué intereses manifestaron para próximas ediciones."
    pie_institucional: "Presenta: {sigla} – {nombre}."

  # ------------------------------------------------------------ 2. Índice
  indice:
    titulo: "Índice"
    subtitulo: "Contenido del informe de resultados."
    # Cada entrada lleva su número de página real (se completa abajo).
    # Si cambia la cantidad de páginas, actualizar el número.
    entradas:
      - texto: "Datos generales del relevamiento"
        pagina: "3"
      - texto: "Preguntas del formulario"
        pagina: "4"
      - texto: "Resultados: perfil de las personas encuestadas"
        pagina: "5"
      - texto: "Resultados: lugar de residencia declarado"
        pagina: "6"
      - texto: "Resultados: vínculo previo con eventos de la Ciudad"
        pagina: "7"
      - texto: "Resultados: canales de llegada"
        pagina: "8"
      - texto: "Resultados: acompañamiento y motivaciones"
        pagina: "9"
      - texto: "Resultados: intereses para próximas ediciones"
        pagina: "10"
      - texto: "Síntesis de resultados observados"
        pagina: "11"
      - texto: "Aspectos a considerar para próximas ediciones"
        pagina: "12"
      - texto: "Anexo: red de cafeterías vinculadas"
        pagina: "13"

  # ------------------------------------------- 3. Datos generales
  datos_generales:
    titulo: "Datos generales del relevamiento"
    subtitulo: "Marco, lugar, fechas y volumen de respuestas obtenidas."
    ficha_titulo: "Ficha del relevamiento"
    modalidad_titulo: "Modalidad"
    modalidad_texto: "El relevamiento se realizó mediante una encuesta en formulario digital, completada por el público durante el evento. El informe presenta los resultados de forma agregada sobre las respuestas obtenidas."
    distribucion_titulo: "Respuestas por día y franja horaria"
    distribucion_intro: "Las respuestas se distribuyeron de la siguiente manera entre ambas jornadas, según el horario de carga registrado:"

  # ---------------------------------------- 4. Preguntas del formulario (1 sola página)
  preguntas:
    titulo: "Preguntas del formulario"
    subtitulo: "Preguntas realizadas al público, tipo de cada una y qué se buscaba observar."
    intro: "El formulario incluyó las siguientes preguntas. Para cada una se indica el tipo y qué se buscaba observar."
    # Nota breve al pie (solo si entra bien en la página).
    nota_pie: "El correo electrónico se usó solo como identificador y para la base de contactos de quienes lo aceptaron. La pregunta cultural cumplió una función operativa durante el evento. Ninguno de los dos se analiza en este informe."

  # ------------------------------- 5. Perfil de las personas encuestadas
  perfil:
    titulo: "Resultados: perfil de las personas"
    subtitulo: "Edad y género de quienes respondieron la encuesta."
    pregunta_edad: "Pregunta analizada: ¿Cuál es tu rango de edad?"
    tipo_edad: "Tipo: cerrada, de opción única."
    observa_edad: "Qué permite observar: la composición etaria de las personas encuestadas."
    pregunta_genero: "Pregunta analizada: ¿Con qué género te identificás?"
    tipo_genero: "Tipo: cerrada, de opción única."
    observa_genero: "Qué permite observar: la composición por género del público que respondió."
    lectura: "El grupo de 25 a 34 años fue el más mencionado, con el {edad_top_pct} de las respuestas. En conjunto, las personas de 18 a 44 años reúnen el {p1844_pct} de las respuestas. Entre quienes respondieron se registra una mayor presencia de mujeres ({mujer_pct})."

  # --------------------------------- 6. Lugar de residencia declarado
  residencia:
    titulo: "Resultados: lugar de residencia declarado"
    subtitulo: "Zona de residencia que declararon las personas encuestadas."
    pregunta: "Pregunta analizada: ¿Dónde vivís actualmente?"
    tipo: "Tipo: cerrada, de opción única (nivel agregado)."
    observa: "Qué permite observar: el alcance territorial declarado por el público encuestado."
    lectura: "La mayor parte de las respuestas corresponde a personas que declararon residir en CABA ({caba_pct}). El resto se reparte entre el Gran Buenos Aires y otras zonas. El barrio o localidad puntual se relevó pero no se presenta de forma individual; los resultados se muestran de forma agregada."

  # ------------------------- 7. Vínculo previo con eventos de la Ciudad
  vinculo:
    titulo: "Resultados: vínculo previo con eventos"
    subtitulo: "Primera asistencia o participación previa, y aceptación de contacto."
    pregunta_primera: "Pregunta analizada: ¿Es la primera vez que venís a un evento gastronómico de la Ciudad?"
    tipo_primera: "Tipo: cerrada, de opción única."
    observa_primera: "Qué permite observar: la proporción de público nuevo y de público que ya había participado."
    pregunta_contacto: "Pregunta analizada: ¿Aceptás recibir información sobre próximos eventos y novedades?"
    tipo_contacto: "Tipo: consentimiento / contacto."
    observa_contacto: "Qué permite observar: la disposición a recibir comunicaciones futuras."
    lectura: "El {recurrente_pct} de las respuestas indica que ya había participado de otros eventos gastronómicos de la Ciudad, mientras que el {primera_pct} corresponde a primeras asistencias. Entre las respuestas válidas, el {contacto_pct} aceptó recibir información sobre próximos eventos."

  # ----------------------------------------- 8. Canales de llegada
  canales:
    titulo: "Resultados: canales de llegada"
    subtitulo: "Canales declarados a través de los cuales el público llegó al evento."
    pregunta: "Pregunta analizada: ¿Cómo te enteraste del evento?"
    tipo: "Tipo: multi-respuesta (una persona pudo elegir más de una opción)."
    observa: "Qué permite observar: los canales de comunicación declarados como vía de llegada."
    lectura: "Instagram fue el canal más mencionado ({instagram_pct}), seguido por la recomendación de amigos, familia o conocidos ({amigos_pct}) y por el paso por la zona ({paso_pct}). Los locales o cafeterías adheridas aparecen con muy pocas menciones como vía de llegada."

  # ----------------------------- 9. Acompañamiento y motivaciones
  acompanamiento:
    titulo: "Resultados: acompañamiento y motivaciones"
    subtitulo: "Con quién asistió el público y qué fue lo que más le interesó."
    pregunta_con_quien: "Pregunta analizada: ¿Con quién viniste al evento?"
    tipo_con_quien: "Tipo: cerrada, de opción única."
    observa_con_quien: "Qué permite observar: la forma de asistencia declarada por el público."
    pregunta_intereso: "Pregunta analizada: ¿Qué fue lo que más te interesó del evento?"
    tipo_intereso: "Tipo: cerrada, de opción única."
    observa_intereso: "Qué permite observar: el principal atractivo del evento según el público."
    lectura: "La mayoría de las respuestas declara haber asistido acompañada: en pareja ({pareja_pct}), con amigos o amigas ({amigos_acomp_pct}) o con familia ({familia_pct}). El atractivo más mencionado fue probar café o cafeterías ({cafe_pct}), seguido por pasear o hacer una salida ({paseo_pct})."

  # ----------------------- 10. Intereses para próximas ediciones
  intereses:
    titulo: "Resultados: intereses para próximas ediciones"
    subtitulo: "Tipos de eventos gastronómicos que el público mencionó como de interés."
    pregunta: "Pregunta analizada: ¿Qué tipo de eventos gastronómicos te interesa que se realicen próximamente?"
    tipo: "Tipo: multi-respuesta (una persona pudo elegir más de una opción)."
    observa: "Qué permite observar: los formatos de evento que el público mencionó con interés a futuro."
    lectura: "Entre las menciones, las más frecuentes fueron vino ({vino_pct}) y pastelería ({pasteleria_pct}), seguidas por food trucks ({food_trucks_pct}), café ({cafe_futuro_pct}) y ferias y mercados ({ferias_pct}). Al tratarse de una pregunta multi-respuesta, los porcentajes pueden superar el 100% y se leen como intereses declarados, no como preferencias excluyentes."

  # ------------------------ 11. Síntesis de resultados observados
  sintesis:
    titulo: "Síntesis de resultados observados"
    subtitulo: "Principales resultados descriptos en el informe."
    intro: "A partir de las respuestas obtenidas se observa lo siguiente:"
    puntos:
      - "Respondió mayormente público de entre 18 y 44 años ({p1844_pct} de las respuestas), con presencia destacada de mujeres ({mujer_pct})."
      - "La mayor parte de las personas encuestadas declaró residir en CABA ({caba_pct})."
      - "El {recurrente_pct} ya había participado de otros eventos gastronómicos de la Ciudad y el {primera_pct} asistía por primera vez."
      - "Instagram fue el canal de llegada más mencionado ({instagram_pct}); la recomendación personal y el paso por la zona también aparecen."
      - "El {contacto_pct} de las respuestas válidas aceptó recibir información sobre próximos eventos."
      - "Entre los intereses a futuro, vino y pastelería fueron los más mencionados."
    nota: "Nota: resultados agregados sobre las respuestas obtenidas. La cantidad de respuestas es acotada y corresponde a quienes completaron el formulario durante el evento."

  # ------------------ 12. Aspectos a considerar para próximas ediciones
  aspectos:
    titulo: "Aspectos a considerar para próximas ediciones"
    subtitulo: "Posibles líneas de trabajo, planteadas de manera tentativa."
    intro: "A modo de hipótesis para próximas ediciones, podrían considerarse los siguientes aspectos:"
    puntos:
      - "Podría sostenerse la difusión por Instagram, que concentró la mayor parte de las menciones de llegada."
      - "Podría evaluarse reforzar la difusión física en locales o cafeterías adheridas, especialmente si se busca complementar el alcance de Instagram."
      - "Sería posible aprovechar la disposición a recibir información de quienes aceptaron contacto, para comunicar próximos eventos."
      - "Podría ampliarse la cantidad de respuestas en futuras ediciones, definiendo puntos y horarios de relevamiento, para obtener una base más amplia."
      - "Los intereses declarados (vino, pastelería, food trucks, café, ferias) podrían tomarse como insumo tentativo para pensar la programación futura."
    nota: "Estas son consideraciones tentativas a partir de una muestra acotada; no constituyen conclusiones definitivas."

  # ------------------ 13. Anexo: red de cafeterías vinculadas
  anexo_red:
    titulo: "Anexo: red de cafeterías vinculadas"
    subtitulo: "Material complementario sobre sedes de cafeterías vinculadas al evento."
    intro: "Como complemento de los resultados de la encuesta, se incluye una lectura territorial de las cafeterías vinculadas al evento. Esta sección es complementaria y no forma parte de los resultados del formulario."
    mapa_sedes_titulo: "Sedes de cafeterías vinculadas en CABA"
    mapa_combinado_titulo: "Sedes de cafeterías y respuestas por comuna"
    en_numeros_titulo: "La red en números"
    en_numeros:
      - "14 marcas relevadas."
      - "39 sedes mapeables en CABA."
      - "2 marcas pendientes de validación."
    nota_prudente: "Sedes públicas conocidas en CABA de marcas/cafeterías vinculadas al evento. No implica que todas esas sedes hayan participado físicamente en la edición relevada."
