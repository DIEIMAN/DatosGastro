# ---------------------------------------------------------------------------
# CONTENIDO EDITABLE — Informe Cafecito (DataGastro)
# ---------------------------------------------------------------------------
# Este archivo contiene SOLO los textos visibles del PDF (títulos, bajadas,
# notas metodológicas, recomendaciones, footer, etc.).
#
# Qué SÍ se puede editar acá:
#   - Cualquier texto entre comillas.
#   - Los ítems de las listas (cada línea que empieza con "- ").
#
# Qué NO tocar:
#   - Los nombres de las claves (lo que está antes de los dos puntos ":").
#   - La indentación (los espacios al principio de cada línea).
#   - Los marcadores tipo {n}, {instagram}, {caba}... → son DATOS calculados
#     que el generador reemplaza por números reales. Si los borrás, el número
#     desaparece. Podés moverlos de lugar dentro del texto, pero conservá el
#     nombre exacto entre llaves.
#
# Para regenerar el PDF de prueba (NO pisa el final):
#   python scripts/cafecito/generar_informe_datagastro_final_editable.py
#
# Más detalle en: docs/cafecito/COMO_EDITAR_INFORME_CAFECITO.md
# ---------------------------------------------------------------------------

marca: "DataGastro"
footer: "DataGastro · Cafecito BA en tu barrio · Informe exploratorio"

paginas:

  # ------------------------------------------------------------ 1. Portada
  portada:
    kicker_marca: "DataGastro"
    kicker_tipo: "Informe exploratorio"
    titulo: "Cafecito BA\nen tu barrio"
    subtitulo: "Lectura de público, territorio y red de cafeterías vinculadas"
    bajada_linea_1: "Una primera lectura del público que respondió el formulario del evento,"
    bajada_linea_2: "su distribución territorial y la red de cafeterías que puede amplificar la difusión."
    ejes:
      - titulo: "Público"
        descripcion: "Quiénes respondieron y desde dónde."
      - titulo: "Territorio"
        descripcion: "Dónde está el público y dónde la red de cafeterías."
      - titulo: "Decisiones"
        descripcion: "Difusión, fidelización y próximas ediciones."
    advertencia_titulo: "Advertencia metodológica"
    advertencia_texto: "Muestra exploratoria, no representativa del público total del evento. Los datos describen a quienes respondieron el formulario y se publican de forma agregada."

  # ------------------------------------------------- 2. Resumen ejecutivo
  resumen_ejecutivo:
    titulo: "Resumen ejecutivo"
    subtitulo: "Qué sabemos, qué oportunidad abre y qué decisiones habilita esta lectura."
    kpis:
      - valor: "79"
        label: "respuestas"
        nota: "base exploratoria"
      - valor: "{instagram}/79"
        label: "Instagram"
        nota: "principal canal"
      - valor: "{contact_yes}/{contact_base}"
        label: "contacto"
        nota: "acepta novedades"
      - valor: "39"
        label: "sedes mapeables"
        nota: "red potencial"
    que_sabemos_titulo: "Qué sabemos"
    que_sabemos:
      - "Respondió un público joven-adulto ({young}/79 entre 18 y 44) y mayormente de CABA ({caba}/79)."
      - "Instagram es el canal dominante de llegada ({instagram}/79); la recomendación ({interpersonal}/79) y el paso por la zona ({paso_zona}/79) completan el cuadro."
      - "Conviven recurrentes ({recurrent}/79) y primeras visitas ({first_time}/79)."
    oportunidad_titulo: "Qué oportunidad abre"
    oportunidad:
      - "Alta aceptación de contacto ({contact_yes}/{contact_base}): base para fidelizar y comunicar."
      - "Una red de 39 sedes conocidas de cafeterías en CABA que hoy no aparece como canal de llegada: red potencial de difusión aún sin activar."
      - "Interés futuro en vino, pastelería, food trucks y café: pistas para programación."
    decisiones_titulo: "Qué decisiones habilita"
    decisiones:
      - "Sostener Instagram y sumar difusión física vía locales adheridos."
      - "Diseñar comunicación posterior con quienes aceptaron contacto."
      - "Usar la red de cafeterías para ampliar alcance por comuna."
    recomendaciones_titulo: "Recomendaciones principales"
    recomendaciones:
      - "Activar cafeterías como puntos de difusión (QR, cartelería, reposts)."
      - "Aumentar muestra y registrar el canal de llegada con más detalle."
      - "Programar próximas ediciones según los intereses declarados."
    cuidado_titulo: "Cuidado metodológico"
    cuidado_texto: "Las cifras describen a quienes respondieron, no al público total. No habilitan inferencias estadísticas ni proyecciones al universo de asistentes."

  # ----------------------------------------- 3. Qué permite decidir
  que_permite_decidir:
    titulo: "Qué permite decidir este relevamiento"
    subtitulo: "No solo qué respondió la gente: qué acción de gestión habilita cada bloque."
    tarjetas:
      - titulo: "Comunicación"
        texto: "Ajustar canales y piezas según cómo se enteran las personas, sin depender solo de redes."
      - titulo: "Difusión territorial"
        texto: "Usar la red de cafeterías como puntos físicos de difusión por comuna."
      - titulo: "Fidelización"
        texto: "Trabajar la aceptación de contacto como puerta de comunicación futura."
      - titulo: "Captación"
        texto: "Distinguir primeras visitas y público recurrente para crecer sin perder audiencia."
      - titulo: "Programación"
        texto: "Leer los intereses futuros como primeras hipótesis de agenda."
      - titulo: "Operativo de campo"
        texto: "Mejorar QR, incentivos, encuestadores y registro del canal de llegada."
    lectura_titulo: "Lectura ejecutiva"
    lectura_texto: "El valor del relevamiento no es medir al público total, sino orientar decisiones concretas: dónde reforzar la difusión, cómo sostener el vínculo con quienes ya asistieron y qué proponer en las próximas ediciones."

  # --------------------------------------------- 4. Perfil de la muestra
  perfil_muestra:
    titulo: "Perfil de la muestra"
    subtitulo: "Edad, género y procedencia describen a quienes respondieron, no al público total."
    titulo_grafico_edad: "Rango de edad"
    titulo_grafico_genero: "Género declarado"
    titulo_procedencia: "Procedencia (nivel macro)"
    lectura_titulo: "Lectura ejecutiva"
    lectura_texto: "El bloque 18 a 44 suma {young}/79 respuestas, con pico en 25 a 34. La muestra captada es joven-adulta, mayoritariamente femenina ({mujer}/79) y de CABA ({caba}/79)."
    cuidado_titulo: "Cuidado metodológico"
    cuidado_texto: "La procedencia se publica a nivel macro (CABA / no CABA) y agregada por comuna. El barrio/localidad libre queda fuera por privacidad. Género: incluye categoría minoritaria (No binario: {nb}). Porcentajes redondeados."
    decision_titulo: "Qué decisión habilita"
    decision_texto: "Ajustar el tono y los canales de comunicación al perfil que efectivamente responde, sin sobregeneralizar al total de asistentes."

  # ----------------------------------- 5. Lectura territorial del público
  lectura_territorial:
    titulo: "Lectura territorial del público"
    subtitulo: "Distribución agregada por comuna de quienes respondieron."
    como_leer_titulo: "Cómo leer el mapa"
    como_leer_texto: "Las respuestas con comuna identificable se concentran en {top_comunas}. El resto se agrupa para no exponer celdas chicas."
    cuidado_titulo: "Cuidado metodológico"
    cuidado_texto: "El peso de Comuna 13 puede reflejar cercanía a Belgrano y al punto/horario de captación. Es señal territorial de la muestra, no un mapa de asistencia."
    lectura_titulo: "Lectura ejecutiva"
    lectura_texto: "El público que respondió se concentra en pocas comunas cercanas al evento. Eso orienta dónde reforzar la difusión local y dónde hay margen para ampliar el alcance en próximas ediciones."

  # ------------------------------- 6. Red territorial de cafeterías
  red_cafeterias:
    titulo: "Red territorial de cafeterías vinculadas"
    subtitulo: "Sedes públicas conocidas en CABA como red potencial de difusión."
    en_numeros_titulo: "La red en números"
    en_numeros:
      - "14 marcas analizadas."
      - "39 sedes mapeables en CABA."
      - "2 marcas pendientes de validación."
    comunas_titulo: "Comunas con más sedes"
    comunas_texto: "{top_sedes}. Palermo, Belgrano y el corredor central concentran la mayor densidad."
    como_leer_titulo: "Cómo leer esta red"
    # Nota de red: se reutiliza también en el anexo (network_note).

  # ----------------------------------- 7. Público y red de difusión
  publico_y_red:
    titulo: "Público y red de difusión"
    subtitulo: "Dónde coincide el público que respondió con la red de cafeterías."
    coincidencias_titulo: "Coincidencias"
    coincidencias:
      - "Comuna 13 (Belgrano) aparece fuerte en respuestas y también con sedes."
      - "Palermo (Comuna 14) concentra muchas sedes, con menor peso del público."
    oportunidad_titulo: "Oportunidad"
    oportunidad:
      - "La red cubre comunas con poco público registrado."
      - "Son zonas para ampliar la difusión física en próximas ediciones."
    cuidado_titulo: "Cuidado metodológico"
    cuidado_texto: "El peso de Comuna 13 / Belgrano debe leerse con cautela por la cercanía al evento y el punto de captación. No se afirma causalidad entre la ubicación de las sedes y el origen del público."

  # ------------------------ 8. Canales de llegada y locales adheridos
  canales_llegada:
    titulo: "Canales de llegada y locales adheridos"
    subtitulo: "Cómo se enteró el público y por qué los locales físicos son una oportunidad."
    titulo_grafico: "Cómo se enteraron del evento"
    lectura_titulo: "Lectura ejecutiva"
    lectura_texto: "Instagram lidera ({instagram}/79). La recomendación ({interpersonal}/79) y el paso por la zona ({paso_zona}/79) completan la llegada. Casi nadie declaró haberse enterado por una cafetería o local adherido."
    oportunidad_titulo: "Oportunidad de mejora"
    oportunidad_texto: "Ese vacío revela un canal sin explotar: los locales adheridos pueden anticipar y reforzar la difusión, sobre todo para público menos digitalizado o que no vive cerca del evento."
    pedir_titulo: "Qué pedir a los locales adheridos"
    pedir:
      - "Publicar historias y repostear las piezas oficiales del evento."
      - "Colocar un QR del evento o del formulario en el mostrador."
      - "Sumar folletería y cartelería física en el local."
      - "Diseñar piezas específicas por barrio o comuna."
      - "El local físico puede ser un canal clave para enterarse antes de la fecha, no solo por pasar casualmente por la zona."
    proximas_titulo: "Para próximas ediciones"
    proximas_texto: "Registrar cómo se enteró cada persona con más detalle: Instagram oficial, Instagram de una cafetería, local físico adherido, recomendación, paso por la zona u otro canal."

  # ----------------------- 9. Vínculo con eventos de la Ciudad
  vinculo_fidelizacion:
    titulo: "Vínculo con eventos de la Ciudad y fidelización"
    subtitulo: "Captación nueva, público recurrente y aceptación de contacto."
    titulo_grafico_primera_vez: "Primera vez vs. recurrentes"
    titulo_grafico_contacto: "Acepta recibir novedades"
    titulo_tabla: "Aceptan contacto / total, por vínculo previo"
    lectura_titulo: "Lectura ejecutiva"
    lectura_texto: "El evento combina fidelización ({recurrent}/79 ya participaron de otros eventos) y captación ({first_time}/79 primeras visitas), con alta aceptación de contacto ({contact_yes}/{contact_base})."
    decision_titulo: "Qué decisión habilita"
    decision_texto: "Diseñar comunicación posterior diferenciada: continuidad para recurrentes y bienvenida/retención para primeras visitas, siempre sin publicar datos personales."
    cuidado_titulo: "Cuidado metodológico"
    cuidado_texto: "La aceptación de contacto se mide sobre respuestas válidas. Los correos no se publican ni se usan en ningún resultado público."

  # ----------------------- 10. Motivaciones e intereses futuros
  motivaciones:
    titulo: "Motivaciones e intereses futuros"
    subtitulo: "Qué atrajo del evento y qué programación habilita a futuro."
    titulo_grafico_atrajo: "Qué atrajo de esta edición"
    titulo_grafico_futuro: "Intereses futuros"
    atrajo_titulo: "Qué atrajo de esta edición"
    atrajo_texto: "Probar café/cafeterías ({coffee}/79) lidera, seguido por pasear o hacer una salida ({paseo}/79) y conocer propuestas nuevas ({nuevas}/79). El atractivo combina producto y experiencia urbana."
    programacion_titulo: "Programación futura"
    programacion_texto: "Como agenda de hipótesis: vino ({vino}), pastelería ({pasteleria}), food trucks ({food_trucks}), café ({cafe_futuro}) y ferias/mercados ({ferias}), más otras señales menores."
    cuidado_titulo: "Cuidado metodológico"
    cuidado:
      - "“Qué interesó del evento” captura un atractivo principal por persona."
      - "“Intereses futuros” es una pregunta multi-respuesta: las cifras son menciones sobre 79 respondentes y una persona pudo elegir más de una opción; no representan personas ni demanda cerrada."

  # ------------------------ 11. Conclusiones y recomendaciones
  conclusiones:
    titulo: "Conclusiones y recomendaciones"
    subtitulo: "Síntesis ejecutiva para orientar las próximas ediciones."
    cierre_titulo: "Lo que muestra el relevamiento"
    cierre:
      - "Cafecito captó principalmente público joven-adulto de CABA, con alta presencia femenina, que combina recurrentes ({recurrent}/79) y primeras visitas ({first_time}/79)."
      - "Instagram concentra la llegada ({instagram}/79), pero la recomendación y el paso por la zona también importan; los locales adheridos casi no aparecen como canal."
      - "La aceptación de contacto ({contact_yes}/{contact_base}) abre una base concreta para fidelizar y comunicar a futuro."
      - "La red de 39 sedes conocidas de cafeterías vinculadas ofrece una infraestructura territorial de difusión potencial todavía sin activar, que cubre comunas más allá del entorno inmediato del evento."
    decision_titulo: "Decisión habilitada"
    decision_texto: "Convertir la red de cafeterías en canal de difusión y construir comunicación con quienes aceptaron contacto."
    recomendacion_titulo: "Recomendación principal"
    recomendacion_texto: "Activar locales adheridos con QR, cartelería y reposts, y registrar mejor el canal de llegada en próximas ediciones."
    lectura_titulo: "Lectura ejecutiva"
    lectura_texto: "El relevamiento no mide al público total, pero da señales accionables sobre perfil, canales, potencial de contacto y red de difusión."
    cuidado_titulo: "Cuidado metodológico"
    cuidado_texto: "Toda la lectura es exploratoria. No se proyecta al universo de asistentes ni se afirma representatividad."
    proximas_titulo: "Recomendaciones para próximas ediciones"
    proximas:
      - "Aumentar la muestra con puntos y horarios de captación definidos y equipo encuestador."
      - "Activar la red de cafeterías como canal físico y digital de difusión por comuna."
      - "Programar según los intereses declarados y sostener Instagram sin depender solo de redes."

  # ------------------------ 12. Anexo metodológico y privacidad
  anexo:
    titulo: "Anexo metodológico y privacidad"
    subtitulo: "Base, tratamiento de datos y criterios de la red territorial."
    base_titulo: "Base y alcance"
    base:
      - "Formulario del evento Cafecito BA en tu barrio."
      - "79 respuestas analizadas."
      - "Muestra exploratoria, no representativa del público total."
      - "Los porcentajes se calculan sobre respuestas válidas por pregunta."
    privacidad_titulo: "Privacidad"
    privacidad:
      - "No se publican correos, nombres, teléfonos ni marcas temporales."
      - "No se listan barrios/localidades individuales."
      - "No se publican respuestas individuales: solo agregados."
      - "El público se muestra agregado por comuna o agregación segura."
    multi_titulo: "Preguntas multi-respuesta"
    multi:
      - "Canales de llegada e intereses futuros se leen por menciones."
      - "Los porcentajes pueden sumar más de 100%."
      - "La categoría “Por amigos, familia o conocidos” se conserva unificada."
    red_titulo: "Red de cafeterías"
    red:
      - "Sedes públicas conocidas en CABA de marcas/cafeterías vinculadas al evento."
      - "Solo se mapean sedes con validación suficiente para el mapa."
      - "No implica participación física de cada sede: es red potencial de difusión."
      - "Las marcas sin sede validada quedan pendientes y fuera del mapa."
    como_leer_titulo: "Cómo leer la red territorial"

# ---------------------------------------------------------------------------
# Nota de red territorial. Aparece en la página 6 ("Cómo leer esta red") y en
# el anexo ("Cómo leer la red territorial"). Editar una sola vez acá.
# ---------------------------------------------------------------------------
network_note: "El mapa muestra sedes públicas conocidas en CABA de marcas/cafeterías vinculadas al evento. No implica que todas esas sedes hayan participado físicamente en la edición relevada; se utiliza como aproximación a la red territorial potencial de difusión."
